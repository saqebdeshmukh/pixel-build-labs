name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - static-milesweb-deployment
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Static Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build static website
        run: npm run build

      - name: Verify static output
        run: |
          test -f .output/public/index.html
          test -f .output/public/about/index.html
          test -f .output/public/services/index.html
          test -f .output/public/solutions/index.html
          test -f .output/public/work/index.html
          test -f .output/public/contact/index.html
          test -f .output/public/privacy/index.html
          test -f .output/public/terms/index.html

      - name: Verify case study pages
        run: |
          test -f .output/public/work/intelligent-invoice-processing/index.html
          test -f .output/public/work/ai-powered-business-workflows/index.html
          test -f .output/public/work/custom-commerce-platform/index.html
          test -f .output/public/work/business-mobile-application/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.output/public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
